[project]
name = "project-agrisathi"
version = "0.1.0"
description = "AgriSathi - AI Voice Assistant for Indian Farmers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "livekit-agents[assemblyai,cartesia,deepgram,google,noise-cancellation,silero,turn-detector]~=1.3",
    "livekit-plugins-openai>=1.3.12",
    "livekit-plugins-turn-detector>=1.3.12",
]

# Make the 'src' directory a proper Python package
[tool.setuptools.packages.find]
where = ["."]

# Tell uv to install this package in editable mode
[tool.uv]
dev-dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
